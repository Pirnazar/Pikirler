# Local stack (backend/docker-compose.yml). Production replaces this file with
# backend/deploy/nginx.conf (real TLS certificate, rate limits).
#
# :80  plain HTTP, published on 127.0.0.1 only — this computer.
# :443 HTTPS with a self-signed certificate (05-pikirler-lan-cert.sh), for
#      phones and laptops on the same Wi-Fi. Browsers allow the microphone and
#      the upload checksum (crypto.subtle) only over HTTPS or on localhost.

server {
    listen 80;
    server_name _;
    server_tokens off;
    include /etc/nginx/pikirler/locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/nginx/lan-certs/cert.pem;
    ssl_certificate_key /etc/nginx/lan-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/pikirler/locations.conf;
}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pikirler-backend"
version = "0.1.0"
description = "Pikirler: private microblog and personal knowledge store (Second Brain module)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1",
  "redis>=5.2,<7",
  "arq>=0.26,<1",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "boto3>=1.35,<2",
  "pillow>=11,<13",
  "filetype>=1.2,<2",
  "python-multipart>=0.0.18,<1",
  "tzdata>=2024.2",
]

[project.optional-dependencies]
# Runs Whisper inside the worker process. Usually ASR runs on a separate GPU
# machine instead (see asr_server/), so this stays optional.
local-asr = ["faster-whisper>=1.1,<2"]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3]>=1.35",
  "types-redis",
]

[project.scripts]
pikirler = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
# RUF001-003: Cyrillic, Turkmen and CJK text is intentional in a multilingual app.
ignore = ["S101", "B008", "RUF012", "S311", "RUF001", "RUF002", "RUF003", "UP046", "UP047",
          "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "ASYNC221", "ASYNC230", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "app/migrations"]

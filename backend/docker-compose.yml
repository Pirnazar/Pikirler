# Local development stack. Production: docker-compose.prod.yml.
#
#   python scripts/init_env.py        # .env with random secrets
#   docker compose up -d --build      # postgres, redis, rustfs, migrate, api, worker
#   docker compose run --rm api pytest
#
# Uploaded files go to RustFS (S3-compatible); storage-init creates the private
# bucket. PIKIRLER_STORAGE_BACKEND=local keeps them in the "mediadata" volume
# instead. Every port is bound to 127.0.0.1 only.
name: pikirler

x-app: &app
  build:
    context: .
    args:
      EXTRAS: dev
  image: pikirler-backend:dev
  env_file: .env
  environment:
    PIKIRLER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PIKIRLER_TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
    PIKIRLER_REDIS_URL: redis://redis:6379/0
    PIKIRLER_TEST_REDIS_URL: redis://redis:6379/15
    PIKIRLER_TEST_S3_ENDPOINT: http://rustfs:9000
  volumes:
    - mediadata:/srv/data/media
    - ./app:/srv/app/app
    - ./tests:/srv/app/tests
    - ./alembic.ini:/srv/app/alembic.ini:ro
    - ./pyproject.toml:/srv/app/pyproject.toml:ro

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # UTF-8 locale: the full-text parser needs it to treat Cyrillic,
      # Turkmen Latin and CJK characters as word characters.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5460}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6460}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. The version is pinned so a new upstream
  # image cannot change the stack under you; override with RUSTFS_IMAGE.
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.4}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-9460}:9000"
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once (no policy is ever attached to it).
  storage-init:
    <<: *app
    command: ["pikirler", "init-storage"]
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy

  # Migrations are a separate one-shot step. env.py additionally holds a
  # PostgreSQL advisory lock, so two concurrent runs cannot interleave.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "app"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8460}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
  mediadata:
  rustfsdata:

# Shared by the HTTP and HTTPS servers of the local stack (default.conf).

# Voice notes and videos are streamed to the API.
client_max_body_size 2g;

root /usr/share/nginx/html;

# Docker's DNS on every request (cached 10 s): the api container's address
# changes whenever it is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;
set $pikirler_api http://api:8000;

location /api/ {
    proxy_pass $pikirler_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location /assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data: https://i.ytimg.com https://images.metahub.space https://image.tmdb.org https://m.media-amazon.com; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}

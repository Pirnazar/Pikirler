# Production stack. Differences from development:
#   * image without dev tools, no source bind mounts, no --reload
#   * nothing but nginx is published; nginx terminates TLS
#   * PIKIRLER_ENVIRONMENT=production (Secure cookies and a real key are enforced)
#   * uploads in RustFS (S3-compatible), or the "mediadata" volume with
#     PIKIRLER_STORAGE_BACKEND=local
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Migrations are an explicit step (the `migrate` service is not started by `up`
# for the api/worker); env.py additionally holds an advisory lock.
name: pikirler-prod

x-app: &app
  build:
    context: .
    args:
      EXTRAS: ""
  image: pikirler-backend:prod
  env_file: .env.production
  restart: unless-stopped
  environment:
    PIKIRLER_ENVIRONMENT: production
    PIKIRLER_COOKIE_SECURE: "true"
    PIKIRLER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    PIKIRLER_REDIS_URL: redis://redis:6379/0
    FORWARDED_ALLOW_IPS: "*"  # only nginx can reach the api on the internal network
  volumes:
    - mediadata:/srv/data/media
  networks: [internal]

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.4}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfsdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Creates the private bucket once (no policy is ever attached to it).
  storage-init:
    <<: *app
    restart: "no"
    command: ["pikirler", "init-storage"]
    depends_on:
      rustfs:
        condition: service_healthy

  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--workers", "2", "--no-server-header"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["arq", "app.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.worker.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # The frontend image (nginx with the built interface); the production
  # config below adds TLS and rate limits in front of the API.
  nginx:
    build:
      context: ../frontend
    image: pikirler-web:prod
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    depends_on: [api]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
  mediadata:
  rustfsdata:

# Reverse proxy for the Pikirler API. TLS terminates here; the API, MinIO,
# PostgreSQL and Redis are reachable only on the internal docker network.

limit_req_zone $binary_remote_addr zone=pikirler_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pikirler_api:10m rate=20r/s;

# Access logs keep the path only: query strings can contain search terms.
log_format pikirler '$remote_addr [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pikirler.example.com;  # your domain

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    server_tokens off;

    # Large voice notes and videos; uploads are streamed to the API.
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    access_log /var/log/nginx/access.log pikirler;

    location /api/v1/pikirler/auth/ {
        limit_req zone=pikirler_auth burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/pikirler/ {
        limit_req zone=pikirler_api burst=40 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # The frontend (../frontend, `npm run build`) is served from the same origin,
    # so session cookies and CSRF work without CORS. add_header in a location
    # replaces the server-level ones, so the security headers are repeated.
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
